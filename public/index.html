<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 34 34%22%3E%3Crect width=%2234%22 height=%2234%22 rx=%229%22 fill=%22%230E7F74%22/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<title>Брокс CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: тёмная навигационная колонка слева, рабочая область справа; воронка прокручивается вбок внутри себя */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#E9EDF1; --line:#D8DFE6;
  --fg:#15212C; --muted:#5C6977; --accent:#0E7F74; --accent-fg:#FFFFFF; --accent-soft:#D7EFEC;
  --rail:#132230; --rail-2:#1C3042; --rail-fg:#C9D5DF; --rail-hi:#FFFFFF;
  --ok:#1C8E52; --ok-soft:#DAF1E3; --warn:#B07A0C; --warn-soft:#F7ECD2; --bad:#C63D33; --bad-soft:#F8DEDB;
  --shadow:0 1px 2px rgba(19,34,48,.06),0 4px 14px rgba(19,34,48,.06);
  --chat:#E9EEEB; --out:#D3F1DF; --in:#FFFFFF; --notebg:#FFF4D2;
  --font-ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-brand:"Unbounded","Manrope",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D141B; --surface:#141E28; --surface-2:#1A2632; --line:#263443;
  --fg:#E4EBF1; --muted:#90A0AF; --accent:#33B5A6; --accent-fg:#06201D; --accent-soft:#163A37;
  --rail:#09111A; --rail-2:#14212E; --rail-fg:#A9B8C5; --rail-hi:#FFFFFF;
  --ok:#47C485; --ok-soft:#173528; --warn:#E0AE45; --warn-soft:#3A2F15; --bad:#F0736A; --bad-soft:#3E1D1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
  --chat:#0F1820; --out:#16402F; --in:#1C2833; --notebg:#3A3118}}
:root[data-theme="dark"]{
  --bg:#0D141B; --surface:#141E28; --surface-2:#1A2632; --line:#263443;
  --fg:#E4EBF1; --muted:#90A0AF; --accent:#33B5A6; --accent-fg:#06201D; --accent-soft:#163A37;
  --rail:#09111A; --rail-2:#14212E; --rail-fg:#A9B8C5; --rail-hi:#FFFFFF;
  --ok:#47C485; --ok-soft:#173528; --warn:#E0AE45; --warn-soft:#3A2F15; --bad:#F0736A; --bad-soft:#3E1D1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
  --chat:#0F1820; --out:#16402F; --in:#1C2833; --notebg:#3A3118}

*{box-sizing:border-box}
body{margin:0}
.login{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.login-card .inp{height:42px}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-fg);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:18px 12px;padding-left:max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px;color:var(--rail-hi);text-decoration:none}
.brand svg{flex:none}
.brand b{font-family:var(--font-brand);font-size:19px;letter-spacing:.02em}
.brand small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--rail-fg);opacity:.7}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--rail-fg);text-decoration:none;font-weight:600;white-space:nowrap}
.nav a:hover{background:var(--rail-2);color:var(--rail-hi)}
.nav a[aria-current="page"]{background:var(--rail-2);color:var(--rail-hi);box-shadow:inset 3px 0 0 var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;line-height:18px}
.rail-foot{margin-top:auto;font-size:12px;opacity:.8;padding:0 6px;display:flex;flex-direction:column;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;min-height:58px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:0;z-index:4}
.search{flex:1;max-width:460px;position:relative}
.search input{width:100%;height:38px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:0 12px 0 36px}
.search svg{position:absolute;left:11px;top:11px;width:16px;height:16px;color:var(--muted)}
.me{margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.content{padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;min-width:0}
.vh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.vh h1{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-right:auto}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;color:var(--muted)}
.notice.warn{background:var(--warn-soft);border-color:transparent;color:var(--fg)}

.btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;height:30px;padding:0 12px;border-radius:6px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
select.inp,input.inp,textarea.inp{height:36px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 10px;width:100%;min-width:0}
textarea.inp{height:auto;min-height:76px;padding:9px 10px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:980px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.tile .v{font-size:24px;font-weight:800;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .s{font-size:12.5px;color:var(--muted)}
.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:980px){.panels{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel>header h2{font-size:15px;font-weight:800;margin-right:auto}
.panel .body{padding:6px 0}
.empty{padding:22px 16px;color:var(--muted);text-align:center}
.empty b{display:block;color:var(--fg);margin-bottom:4px}

.row{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;min-width:0}
.row:hover{background:var(--surface-2)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--fg);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}

.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11.5px;font-weight:800;color:#fff;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:22px;height:22px;font-size:9.5px}

/* Воронка */
.boardwrap{overflow-x:auto;padding-bottom:6px;margin-inline:-4px}
.board{display:flex;gap:12px;padding-inline:4px;align-items:flex-start;min-height:200px}
.col{flex:0 0 276px;background:var(--surface-2);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 260px);min-height:180px;border-top:4px solid var(--c)}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col-h{padding:10px 12px 8px;display:flex;flex-direction:column;gap:2px}
.col-h b{font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.col-h span{font-size:12.5px;color:var(--muted)}
.col-add{margin:0 10px 8px;height:32px;border:1px dashed var(--line);border-radius:8px;background:transparent;color:var(--muted);font-weight:700}
.col-add:hover{border-color:var(--accent);color:var(--accent)}
.col-b{overflow-y:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;display:flex;flex-direction:column;gap:6px;cursor:grab;box-shadow:var(--shadow)}
.card:hover{border-color:var(--muted)}
.card.drag{opacity:.45}
.card .t{font-weight:700;overflow-wrap:anywhere}
.card .b{font-weight:800}
.card .m{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .f{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .f .av{margin-left:auto}
.dropbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:14px;text-align:center;font-weight:800;color:var(--muted)}
.drop.ok{color:var(--ok)} .drop.bad{color:var(--bad)}
.drop.over{background:var(--surface);border-color:currentColor}
@media (max-width:560px){.dropbar{grid-template-columns:1fr}}

/* Таблицы */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800;background:var(--surface)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}

/* Задачи */
.tgroup h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 16px 4px;font-weight:800}
.tgroup h3.bad{color:var(--bad)}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;padding:0}
.chk[aria-checked="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.chk svg{width:12px;height:12px}
.done .t{text-decoration:line-through;color:var(--muted)}
.due{font-size:12.5px;font-weight:700;white-space:nowrap}
.due.bad{color:var(--bad)}

/* Отчёты */
.bars{display:flex;flex-direction:column;gap:10px;padding:14px 16px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) auto;gap:10px;align-items:center}
.bar .lbl{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px}
.bar .val{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}

/* Шторка и окна */
.scrim{position:fixed;inset:0;background:rgba(10,18,26,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1240px,100%);background:var(--bg);z-index:21;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,390px) minmax(0,1fr);overflow:hidden}
.dleft{overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px;padding:14px 18px 24px}
.dtop{display:flex;justify-content:space-between;gap:8px;margin:0 -8px}
.dtitle{font-size:21px;font-weight:800;letter-spacing:-.01em;border:1px solid transparent;border-radius:8px;padding:4px 7px;margin:-4px -7px;background:transparent;width:calc(100% + 14px)}
.dtitle:hover,.dtitle:focus{border-color:var(--line);background:var(--bg)}
.dmeta{font-size:12.5px;color:var(--muted);margin-top:-8px}
.stagebar{display:flex;gap:3px}
.stagebar button{flex:1;height:10px;border:0;border-radius:5px;padding:0}
.stagebar button:hover{filter:brightness(.9)}
.stagelbl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap}
.dform{display:flex;flex-direction:column;gap:12px}
.fk{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.dright{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--chat)}
.feedwrap{flex:1;min-height:0;overflow-y:auto;padding:16px 20px}
.feed{display:flex;flex-direction:column;gap:10px}
.day{align-self:center;font-size:12px;font-weight:800;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px 11px}
.ev{align-self:center;font-size:12.5px;color:var(--muted);text-align:center;max-width:90%}
.msg{max-width:min(540px,84%);padding:8px 11px;border-radius:12px;box-shadow:var(--shadow)}
.msg.out{align-self:flex-end;background:var(--out);border-bottom-right-radius:4px}
.msg.in{align-self:flex-start;background:var(--in);border-bottom-left-radius:4px}
.msg .mh{font-size:12px;font-weight:800;color:var(--accent)}
.msg .mt{font-size:11px;color:var(--muted);text-align:right;margin-top:3px}
.x{white-space:pre-wrap;overflow-wrap:anywhere}
.fi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;display:flex;align-items:center;gap:10px;max-width:640px;width:100%;align-self:center}
.fi.note{background:var(--notebg);border-color:transparent;align-items:flex-start}
.fi .fh{font-size:12px;color:var(--muted)}
.fi .grow{min-width:0;flex:1}
.fi.task{cursor:pointer}
.fi.task .t{font-weight:700}
.composer{background:var(--surface);border-top:1px solid var(--line);padding:10px 16px 14px;display:flex;flex-direction:column;gap:8px}
.cpane{display:flex;flex-direction:column;gap:8px}
.ctabs{display:flex;gap:4px}
.ctabs button{border:0;background:transparent;font-weight:800;padding:6px 11px;border-radius:6px;color:var(--muted)}
.ctabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.tpls{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tpls button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:700}
.tpls button:hover{border-color:var(--accent);color:var(--accent)}
.crow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.waTo{font-size:12.5px;color:var(--muted);margin-right:auto;min-width:0}
.btn.wa{background:#1F9D55;border-color:#1F9D55;color:#fff;text-decoration:none}
.btn.wa:hover{filter:brightness(1.08)}
@media (max-width:1000px){.dbody{grid-template-columns:minmax(250px,34%) minmax(0,1fr)}.dleft .grid2{grid-template-columns:1fr}.dleft{padding-inline:14px}}
@media (max-width:540px){.dbody{grid-template-columns:1fr;overflow-y:auto}.dleft{overflow:visible;border-right:0;border-bottom:1px solid var(--line)}.dright{min-height:80vh}}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(540px,calc(100% - 32px));max-height:calc(100% - 40px);overflow-y:auto;background:var(--surface);border-radius:12px;z-index:31;box-shadow:0 20px 50px rgba(0,0,0,.3);display:flex;flex-direction:column}
.modal>header{padding:16px 18px 6px;display:flex;align-items:center;gap:8px}
.modal>header h2{font-size:18px;font-weight:800;margin-right:auto}
.modal .mb{padding:10px 18px;display:flex;flex-direction:column;gap:12px}
.modal footer{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal footer .btn.danger{margin-right:auto}
.scrim.top{z-index:30}
.confirm{z-index:41}
.scrim.top2{z-index:40}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:700;z-index:60;max-width:calc(100% - 32px)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0}
.sw[aria-pressed="true"]{border-color:var(--fg)}
.stage-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.stage-row:last-child{border-bottom:0}
.stage-row .inp{flex:1;min-width:160px}
.pipes{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.pipes .btn{flex:none}
table.perm{min-width:680px}
table.perm tbody tr{cursor:default}
table.perm tbody tr:hover{background:transparent}
table.perm td,table.perm th{padding:8px 10px}
table.perm select{font-weight:700;height:32px}
.lv-none{color:var(--bad)} .lv-own{color:var(--warn)} .lv-dept{color:var(--accent)} .lv-all{color:var(--ok)}
.permx{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.chk-l{display:inline-flex;gap:7px;align-items:center;font-weight:600;padding:5px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.ro .stagebar button,.ro [data-a="stage-pick"]{pointer-events:none}

@media (max-width:820px){
  .app{grid-template-columns:64px minmax(0,1fr)}
  .rail{padding:14px 8px;padding-left:max(8px,env(safe-area-inset-left,0px));align-items:center}

<script>
(function(){
const ICONS={
  home:'<path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/>',
  deals:'<rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/>',
  tasks:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="m3 6 1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/>',
  contacts:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/>',
  reports:'<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>',
  team:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  setup:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>'
};
const VIEWS=[['home','Рабочий стол'],['deals','Сделки'],['tasks','Задачи'],['contacts','Клиенты'],['reports','Аналитика'],['team','Команда'],['setup','Воронки']];
const DEFAULT_STAGES=[
  {id:'s_new',name:'Новая заявка',color:'#5B7CE6'},
  {id:'s_qual',name:'Выявление потребности',color:'#2BA3C4'},
  {id:'s_talk',name:'Переговоры',color:'#D59A1F'},
  {id:'s_offer',name:'Отправлено предложение',color:'#B865D6'},
  {id:'s_contract',name:'Договор и оплата',color:'#E0703A'}
];
const PALETTE=['#5B7CE6','#2BA3C4','#1C9E7E','#7DB547','#D59A1F','#E0703A','#D2504B','#B865D6','#7A869A'];
const WON='won', LOST='lost';
const TASK_TYPES=['Звонок','Встреча','Письмо','Дело'];
const COLS=['deals','contacts','companies','tasks','members','pipelines','depts','roles'];
const FORMS=['ИП','ТОО','Другое'];
const TAX=['Общеустановленный режим','Не общеустановленный (спецрежим)'];
const PAYERS=['Юридическое лицо','Физическое лицо'];
const PAYS=['Kaspi Gold','Рассрочка','Счёт на юрлицо'];
const opts=(arr,v)=>'<option value="">Не указано</option>'+arr.map(x=>'<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>').join('');

let savedPipe='main'; try{ savedPipe=localStorage.getItem('broks.pipe')||'main' }catch(e){}
const S={deals:{},contacts:{},companies:{},tasks:{},members:{},pipelines:{},depts:{},roles:{},roleSel:'r_manager',stages:null,me:null,owner:false,pipe:savedPipe,
  mode:'starting',view:'home',q:'',dealsMode:'board',dealsOwner:'all',dealsStatus:'open',taskFilter:'mine',
  contactTab:'companies',period:'month',overlay:null};
let db=null, users=null;
const names={}, avatars={};
let pendingRender=false, joined=false;

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
const rub=n=>nf.format(+n||0)+' ₸';
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const now=()=>new Date().toISOString();
const icon=(k)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[k]+'</svg>';
const MAIN='main';
const DEFAULT_DEPTS=[{id:'d_sales',name:'Отдел продаж'},{id:'d_reg',name:'Отдел регистрации'},{id:'d_tech',name:'Техобслуживание'}];
function pipelines(){ const ps=list('pipelines'); if(!S.pipelines[MAIN]) ps.push({id:MAIN,name:'Продажи',stages:(S.stages&&S.stages.length?S.stages:DEFAULT_STAGES),order:0});
  return ps.sort((a,b)=>(a.order||0)-(b.order||0)||(a.createdAt||'').localeCompare(b.createdAt||'')) }
function pipeOf(id){ const ps=pipelines(); return ps.find(p=>p.id===id)||ps[0] }
function stagesOf(pid){ const p=pipeOf(pid); return p.stages&&p.stages.length?p.stages:DEFAULT_STAGES }
const stages=()=>stagesOf(S.pipe);
const dealPipe=d=>(d.pipeline&&pipelines().some(p=>p.id===d.pipeline))?d.pipeline:MAIN;
function setPipe(id){ S.pipe=id; try{ localStorage.setItem('broks.pipe',id) }catch(e){} }
function stageOf(id){ if(id===WON) return {id:WON,name:'Успешно',color:'var(--ok)'}; if(id===LOST) return {id:LOST,name:'Отказ',color:'var(--bad)'};
  for(const p of pipelines()){ const s=(p.stages&&p.stages.length?p.stages:DEFAULT_STAGES).find(s=>s.id===id); if(s) return s } return {id,name:'Без этапа',color:'#7A869A'} }
function stageOptions(pid,cur){ return stagesOf(pid).map(s=>'<option value="'+esc(s.id)+'"'+(cur===s.id?' selected':'')+'>'+esc(s.name)+'</option>').join('')+'<option value="'+WON+'"'+(cur===WON?' selected':'')+'>Успешно реализовано</option><option value="'+LOST+'"'+(cur===LOST?' selected':'')+'>Закрыто: отказ</option>' }
function departments(){ const ds=list('depts'); return ds.length?ds.sort((a,b)=>(a.order||0)-(b.order||0)||(a.name||'').localeCompare(b.name||'','ru')):DEFAULT_DEPTS.map((d,i)=>Object.assign({order:i},d)) }
// ---------- права доступа ----------
const ENT=[['deals','Сделки'],['contacts','Контактные лица'],['companies','Клиенты (бренды)'],['tasks','Задачи']];
const ACTS=[['create','Создание'],['view','Просмотр'],['edit','Правка'],['del','Удаление']];
const LV=[['none','Запрещено'],['own','Если ответственный'],['dept','Для отдела'],['all','Разрешено']];
const P4=(c,v,e,d)=>({create:c,view:v,edit:e,del:d});
const DEFAULT_ROLES=[
  {id:'r_admin',name:'Администратор',manage:true,reports:true,pipes:'all',order:0,perms:{deals:P4('all','all','all','all'),contacts:P4('all','all','all','all'),companies:P4('all','all','all','all'),tasks:P4('all','all','all','all')}},
  {id:'r_manager',name:'Менеджер',manage:false,reports:false,pipes:'all',order:1,perms:{deals:P4('all','dept','own','none'),contacts:P4('all','all','own','none'),companies:P4('all','all','own','none'),tasks:P4('all','own','own','own')}},
  {id:'r_intern',name:'Стажёр',manage:false,reports:false,pipes:'all',order:2,perms:{deals:P4('all','own','own','none'),contacts:P4('all','own','own','none'),companies:P4('all','own','own','none'),tasks:P4('all','own','own','none')}}
];
function roles(){ const rs=list('roles'); const base=rs.length?rs:DEFAULT_ROLES.map(r=>JSON.parse(JSON.stringify(r)));
  if(!base.some(r=>r.id==='r_admin')) base.push(JSON.parse(JSON.stringify(DEFAULT_ROLES[0])));
  return base.sort((a,b)=>(a.order||0)-(b.order||0)||(a.name||'').localeCompare(b.name||'','ru')) }
function roleOfMember(id){ const m=S.members[id], rs=roles();
  if(m&&m.access){ const r=rs.find(x=>x.id===m.access); if(r) return r }
  return rs.find(x=>x.id===(m&&m.role==='Руководитель'?'r_admin':'r_manager'))||rs[0] }
function myRole(){ if(S.mode==='local'||S.owner) return DEFAULT_ROLES[0]; return roleOfMember(S.me) }
function isBoss(){ return !!myRole().manage }
function can(ent,act,rec){ const r=myRole(); if(r.manage) return true; const l=((r.perms||{})[ent]||{})[act]||'none';
  if(l==='all') return true; if(l==='none') return false; if(act==='create') return true;
  const ow=rec&&rec.owner; if(!ow) return false; if(ow===S.me) return true;
  if(l==='dept'){ const me=S.members[S.me], o=S.members[ow]; return !!(me&&me.dept&&o&&o.dept===me.dept) } return false }
function pipeOk(pid){ const r=myRole(); return r.manage||!Array.isArray(r.pipes)||r.pipes.includes(pid) }
function vis(col){ let rs=list(col).filter(r=>can(col,'view',r)); if(col==='deals') rs=rs.filter(d=>pipeOk(dealPipe(d))); return rs }
async function ensureRoles(){ if(list('roles').length) return true; for(const r of DEFAULT_ROLES){ const c=JSON.parse(JSON.stringify(r)); delete c.id; if(!await put('roles',r.id,c)) return false } return true }
function applyPerms(root){ if(!root) return; const m={'new-deal':'deals','new-task':'tasks','qt-add':'tasks','new-contact':'contacts','new-company':'companies'};
  Object.keys(m).forEach(a=>root.querySelectorAll('[data-a="'+a+'"]').forEach(b=>{ b.hidden=!can(m[a],'create') })) }
async function ensureDepts(){ if(list('depts').length) return true; for(const [i,d] of DEFAULT_DEPTS.entries()){ if(!await put('depts',d.id,{name:d.name,order:i})) return false } return true }
const isOpen=d=>d.stage!==WON&&d.stage!==LOST;
const list=col=>Object.entries(S[col]).map(([id,v])=>Object.assign({id},v));

function fmtDate(iso,withTime){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return '';
  const o={day:'numeric',month:'short'}; if(d.getFullYear()!==new Date().getFullYear()) o.year='numeric';
  let s=d.toLocaleDateString('ru-RU',o); if(withTime) s+=', '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); return s }
function toLocalInput(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes()) }
function dayStart(off){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+(off||0)); return d }
function bucket(t){ if(t.done) return 'done'; if(!t.due) return 'later'; const d=new Date(t.due);
  if(d<new Date()) return 'overdue'; if(d<dayStart(1)) return 'today'; if(d<dayStart(2)) return 'tomorrow'; return 'later' }

// ---------- люди ----------
function memberName(id){ const m=S.members[id]; if(!m) return id?'Бывший сотрудник':'Не назначен';
  if(m.name) return m.name; if(m.label) return m.label; if(m.uid&&names[m.uid]) return names[m.uid]; return m.uid===S.me?'Вы':'Сотрудник' }
function hue(id){ let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))>>>0; return PALETTE[h%PALETTE.length] }
function avatar(id,cls){ const m=S.members[id]; const nm=memberName(id);
  if(m&&m.uid&&avatars[m.uid]&&!m.label) return '<span class="av '+(cls||'')+'" title="'+esc(nm)+'"><img alt="" src="'+esc(avatars[m.uid])+'"></span>';
  const ini=nm.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
  return '<span class="av '+(cls||'')+'" style="background:'+hue(id||'x')+'" title="'+esc(nm)+'">'+esc(ini)+'</span>' }
async function refreshNames(){ if(!users) return; const ids=Object.values(S.members).map(m=>m.uid).filter(Boolean); if(!ids.length) return;
  const ps=await users.profiles(ids); let ch=false;
  ids.forEach(i=>{ const p=ps[i]||{}; if(names[i]!==(p.name||'')){names[i]=p.name||'';ch=true} if(avatars[i]!==p.avatarUrl){avatars[i]=p.avatarUrl;ch=true} });
  if(ch) render() }
const team=()=>list('members').filter(m=>!m.pending&&!m.blocked);
function memberOptions(sel,allowNone){ const ms=team().sort((a,b)=>memberName(a.id).localeCompare(memberName(b.id),'ru'));
  return (allowNone?'<option value="">Не назначен</option>':'')+ms.map(m=>'<option value="'+esc(m.id)+'"'+(m.id===sel?' selected':'')+'>'+esc(memberName(m.id))+(m.id===S.me?' (вы)':'')+'</option>').join('') }

// ---------- хранилище (Supabase) ----------
let sb=null, live=null;
function errText(e){ const m=String((e&&(e.message||e.code))||'');
  if(/row-level security|permission|42501/i.test(m)) return 'Нет прав на это действие. Обратитесь к руководителю.';
  if(/JWT|token/i.test(m)) return 'Сессия истекла. Обновите страницу и войдите заново.';
  return 'Не удалось сохранить. Проверьте интернет и повторите.' }
async function put(col,id,data){
  if(sb){ const {error}=await sb.from('docs').upsert({col,id,data}); if(error){ toast(errText(error)); return false } }
  S[col][id]=data; render(); return true }
async function del(col,id){
  if(sb){ const {data,error}=await sb.from('docs').delete().eq('col',col).eq('id',id).select('id'); if(error){ toast(errText(error)); return false }
    if(!data||!data.length){ toast('Нет прав на удаление. Обратитесь к руководителю.'); return false } }
  delete S[col][id]; render(); return true }
function savePipe(p,patch){ return put('pipelines',p.id,Object.assign({name:p.name,stages:stagesOf(p.id),order:p.order||0,createdAt:p.createdAt||now()},patch)) }
function putStages(st){ return savePipe(pipeOf(S.pipe),{stages:st}) }
async function api(action,payload){
  const {data:{session}}=await sb.auth.getSession();
  let r; try{ r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(session?session.access_token:'')},body:JSON.stringify(Object.assign({action},payload||{}))}) }catch(e){ throw new Error('Нет связи с сервером. Проверьте интернет.') }
  let j={}; try{ j=await r.json() }catch(e){}
  if(!r.ok) throw new Error(j.error||'Сервер не ответил. Повторите.'); return j }

async function loadAll(){ const fresh={}; COLS.forEach(c=>{ fresh[c]={} }); let stagesCfg=null;
  for(let from=0;;from+=1000){ const {data,error}=await sb.from('docs').select('col,id,data').order('col').order('id').range(from,from+999);
    if(error) return false;
    data.forEach(r=>{ if(fresh[r.col]) fresh[r.col][r.id]=r.data; else if(r.col==='config'&&r.id==='pipeline') stagesCfg=r.data.stages||null });
    if(data.length<1000) break }
  COLS.forEach(c=>{ S[c]=fresh[c] }); S.stages=stagesCfg; return true }
let reloadT=null;
function reloadSoon(){ clearTimeout(reloadT); reloadT=setTimeout(()=>{ loadAll().then(ok=>{ if(ok) render() }) },400) }
function subscribe(){
  live=sb.channel('docs-live').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
    if(p.eventType==='DELETE'){ const o=p.old||{}; if(S[o.col]) delete S[o.col][o.id] }
    else { const n=p.new||{}; if(S[n.col]) S[n.col][n.id]=n.data; if(n.col==='members'&&n.id===S.me||n.col==='roles') reloadSoon() }
    render() }).subscribe();
  setInterval(()=>{ if(document.visibilityState==='visible') reloadSoon() },60000);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') reloadSoon() }) }

async function boot(){
  readHash(); render();
  let cfg=null; try{ cfg=await (await fetch('/api/config',{cache:'no-store'})).json() }catch(e){}
  if(!cfg||!cfg.url||!cfg.anon||!window.supabase){ offline(); return }
  sb=window.supabase.createClient(cfg.url,cfg.anon,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'broks-auth'}});
  sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT') location.reload() });
  const {data:{session}}=await sb.auth.getSession();
  if(session) start(session.user); else showLogin() }
async function start(user){
  hideLogin(); S.me=user.id; S.email=user.email; S.mode='starting'; render();
  const timer=setTimeout(()=>{ if(S.mode==='starting'){ S.mode='slow'; render() } },10000);
  let ok=await loadAll();
  if(ok&&!S.members[S.me]){ try{ await api('claim',{}); ok=await loadAll() }catch(e){} }
  clearTimeout(timer); S.mode=ok?'live':'slow'; render(); if(ok) subscribe() }
function showLogin(){ $('#login').hidden=false; setTimeout(()=>{ const e=$('#lg-email'); if(e) e.focus() },50) }
function hideLogin(){ $('#login').hidden=true }
document.addEventListener('submit',async e=>{ if(e.target.id!=='loginForm') return; e.preventDefault();
  const btn=$('#lg-btn'), err=$('#lg-err'); err.textContent=''; btn.disabled=true; btn.textContent='Входим…';
  const {data,error}=await sb.auth.signInWithPassword({email:$('#lg-email').value.trim(),password:$('#lg-pass').value});
  btn.disabled=false; btn.textContent='Войти';
  if(error){ err.textContent=/banned/i.test(error.message)?'Доступ закрыт. Обратитесь к руководителю.':/invalid/i.test(error.message)?'Неверная почта или пароль.':'Не получилось войти. Проверьте интернет и повторите.'; return }
  $('#lg-pass').value=''; start(data.user) });
async function logout(){ try{ await sb.auth.signOut() }catch(e){} location.reload() }
function offline(){ S.mode='local'; S.me='local'; S.members={local:{name:'Вы',role:'Руководитель',access:'r_admin',createdAt:now()}}; render() }

// ---------- навигация ----------
function readHash(){ const h=(location.hash||'').slice(1); if(VIEWS.some(v=>v[0]===h)) S.view=h }
window.addEventListener('hashchange',()=>{ readHash(); render(true) });
function go(v){ S.view=v; try{ history.replaceState(null,'','#'+v) }catch(e){} render(true); window.scrollTo(0,0) }

// ---------- отрисовка ----------
function render(force){
  const main=$('#main'); const a=document.activeElement;
  if(!force&&a&&main.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){ pendingRender=true; return }
  pendingRender=false;
  const overdue=vis('tasks').filter(t=>t.owner===S.me&&bucket(t)==='overdue').length;
  if((S.view==='setup'&&!isBoss())||(S.view==='reports'&&!myRole().reports&&S.mode==='live')) S.view='home';

  ctab:el=>{ document.querySelectorAll('.ctabs button').forEach(b=>b.setAttribute('aria-selected',String(b===el))); ['wa','note','task'].forEach(k=>{ $('#cp-'+k).hidden=k!==el.dataset.v });
    const f=$('#cp-'+el.dataset.v+' textarea, #cp-'+el.dataset.v+' input'); if(f) f.focus() },
  tpl:el=>{ const t=$('#waText'); t.value=fillTpl(TEMPLATES[+el.dataset.i][1],S.deals[S.overlay.id]); updateWa(); t.focus() },
  'wa-send':async(el,e)=>{ const t=$('#waText'), v=t.value.trim(), d=S.deals[S.overlay.id];
    if(!dealPhone(d)){ e.preventDefault(); toast('Добавьте телефон контактному лицу или клиенту'); return }
    if(!v){ e.preventDefault(); toast('Напишите сообщение или выберите шаблон'); t.focus(); return }
    updateWa(); t.value=''; if(!await logNote('wa_out',v)) t.value=v; updateWa() },
  'wa-in':async()=>{ const t=$('#waText'), v=t.value.trim(); if(!v){ toast('Вставьте в поле текст ответа клиента'); t.focus(); return }
    t.value=''; if(!await logNote('wa_in',v,{from:clientName(S.deals[S.overlay.id])})) t.value=v; updateWa() },
  'qt-add':async()=>{ const text=$('#qt-text').value.trim(); if(!text){ toast('Опишите задачу'); $('#qt-text').focus(); return } const v=$('#qt-due').value;
    const ok=await put('tasks',newId(),{text,type:$('#qt-type').value,due:v?new Date(v).toISOString():'',owner:$('#qt-owner').value,deal:S.overlay.id,done:false,createdAt:now(),by:S.me});
    if(ok){ $('#qt-text').value=''; toast('Задача поставлена'); renderDealLive(true) } },
  'stage-pick':el=>{ const o=S.overlay; const v=el.dataset.v; $('#d-stage').value=v; if(o.isNew||o.pipe!==dealPipe(S.deals[o.id])) renderStageBar(v); else moveDeal(o.id,v) },
  'pipe-pick':el=>{ setPipe(el.dataset.v); render(true) },
  'pipe-add':async()=>{ if(!isBoss()) return; const id='p_'+newId(); const ord=Math.max(0,...pipelines().map(p=>p.order||0))+1;
    const ok=await put('pipelines',id,{name:'Новая воронка',order:ord,createdAt:now(),stages:[{id:'s_'+newId()+'a',name:'Новая заявка',color:'#5B7CE6'},{id:'s_'+newId()+'b',name:'В работе',color:'#D59A1F'},{id:'s_'+newId()+'c',name:'Готово к закрытию',color:'#1C9E7E'}]});
    if(ok){ setPipe(id); go('setup'); toast('Воронка создана. Задайте ей название и этапы'); setTimeout(()=>{ const i=$('#pipe-name'); if(i){ i.focus(); i.select() } },60) } },
  'pipe-del':()=>{ const p=pipeOf(S.pipe); if(p.id===MAIN) return; const n=list('deals').filter(d=>dealPipe(d)===p.id).length;
    if(n){ toast('Сначала перенесите '+n+' '+plural(n,'сделку','сделки','сделок')+' в другую воронку'); return }
    confirmBox('Удалить воронку «'+p.name+'»?','Удалить',async()=>{ if(await del('pipelines',p.id)){ setPipe(MAIN); render(true); toast('Воронка удалена') } }) },
  'dept-add':()=>{ if(isBoss()) openOverlay({kind:'dept',isNew:true}) },
  'open-dept':el=>{ if(isBoss()) openOverlay({kind:'dept',id:el.dataset.id}) },
  'dept-save':async()=>{ const o=S.overlay; const name=$('#dp-name').value.trim(); if(!name){ toast('Введите название отдела'); $('#dp-name').focus(); return }
    if(!await ensureDepts()) return; const id=o.isNew?'d_'+newId():o.id; const prev=S.depts[id]||{};
    const ord=o.isNew?Math.max(0,...departments().map(x=>x.order||0))+1:(prev.order||0);
    if(await put('depts',id,{name:name.slice(0,50),order:ord})){ toast(o.isNew?'Отдел создан':'Сохранено'); closeOverlay() } },
  'dept-del':()=>{ const id=S.overlay.id; confirmBox('Удалить отдел «'+((departments().find(x=>x.id===id)||{}).name||'')+'»?','Удалить',async()=>{ if(!await ensureDepts()) return; if(await del('depts',id)){ toast('Отдел удалён'); closeOverlay() } }) },
  'role-pick':el=>{ S.roleSel=el.dataset.v; render(true) },
  'role-add':async()=>{ if(!await ensureRoles()) return; const base=roles().find(x=>x.id==='r_manager')||DEFAULT_ROLES[1]; const id='r_'+newId();
    const r=JSON.parse(JSON.stringify(base)); delete r.id; r.name='Новый профиль'; r.manage=false; r.order=Math.max(0,...roles().map(x=>x.order||0))+1;
    if(await put('roles',id,r)){ S.roleSel=id; render(true); toast('Профиль создан. Задайте название и права'); setTimeout(()=>{ const i=$('#role-name'); if(i){ i.focus(); i.select() } },60) } },
  'role-del':()=>{ const id=S.roleSel; if(id==='r_admin') return; const n=list('members').filter(m=>roleOfMember(m.id).id===id).length;
    if(n){ toast('Сначала смените профиль у '+n+' '+plural(n,'сотрудника','сотрудников','сотрудников')); return }
    confirmBox('Удалить профиль «'+((roles().find(x=>x.id===id)||{}).name||'')+'»?','Удалить',async()=>{ if(!await ensureRoles()) return; if(await del('roles',id)){ S.roleSel='r_manager'; render(true); toast('Профиль удалён') } }) },
  'new-task':el=>{ const back=S.overlay&&S.overlay.kind==='deal'&&!S.overlay.isNew?{kind:'deal',id:S.overlay.id}:null; openOverlay({kind:'task',isNew:true,deal:el.dataset.deal||'',back}) },
  'open-task':el=>{ const back=S.overlay&&S.overlay.kind==='deal'?{kind:'deal',id:S.overlay.id}:null; openOverlay({kind:'task',id:el.dataset.id,back}) },
  'toggle-task':async(el,e)=>{ e.stopPropagation(); const id=el.dataset.id; if(!can('tasks','edit',S.tasks[id])){ toast('Нет прав на изменение этой задачи'); return } const t=Object.assign({},S.tasks[id]); t.done=!t.done; if(t.done) t.doneAt=now(); else delete t.doneAt; if(await put('tasks',id,t)){ toast(t.done?'Задача выполнена':'Задача снова в работе'); renderDealLive() } },
  'task-type':el=>{ $('#t-type').value=el.dataset.v; document.querySelectorAll('[data-a="task-type"]').forEach(b=>b.classList.toggle('primary',b===el)) },
  'task-save':()=>saveTask(),
  'task-back':()=>backOrClose(),
  'task-del':()=>{ const id=S.overlay.id; confirmBox('Удалить задачу?','Удалить',async()=>{ if(await del('tasks',id)){ toast('Задача удалена'); backOrClose() } }) },
  'new-contact':()=>openOverlay({kind:'contact',isNew:true}),
  'open-contact':el=>openOverlay({kind:'contact',id:el.dataset.id}),
  'contact-save':()=>saveContact(),
  'contact-del':()=>{ const id=S.overlay.id; confirmBox('Удалить контакт «'+(S.contacts[id]||{}).name+'»? Сделки останутся.','Удалить',async()=>{ if(await del('contacts',id)){ toast('Контакт удалён'); closeOverlay() } }) },
  'new-company':()=>openOverlay({kind:'company',isNew:true}),
  'open-company':el=>{ const back=S.overlay&&S.overlay.kind==='deal'&&!S.overlay.isNew?{kind:'deal',id:S.overlay.id}:null; openOverlay({kind:'company',id:el.dataset.id,back}) },
  'company-save':()=>saveCompany(),
  'company-del':()=>{ const id=S.overlay.id; confirmBox('Удалить клиента «'+(S.companies[id]||{}).name+'»? Контакты и сделки останутся.','Удалить',async()=>{ if(await del('companies',id)){ toast('Клиент удалён'); closeOverlay() } }) },
  'new-member':()=>{ if(isBoss()) openOverlay({kind:'member',isNew:true}) },
  'open-member':el=>{ if(isBoss()) openOverlay({kind:'member',id:el.dataset.id}) },
  'member-save':()=>saveMember(),
  'member-del':()=>{ const id=S.overlay.id, m=S.members[id]; if(!m) return;
    if(!sb){ confirmBox('Убрать «'+memberName(id)+'» из команды?','Убрать',async()=>{ if(await del('members',id)){ toast('Сотрудник убран'); closeOverlay() } }); return }
    confirmBox('Закрыть доступ для «'+memberName(id)+'»? Он больше не сможет войти. Его сделки и задачи останутся, вернуть доступ можно в любой момент.','Закрыть доступ',async()=>{
      try{ const j=await api('block',{id,blocked:true}); S.members[id]=j.data; render(); closeOverlay(); toast('Доступ закрыт') }catch(e){ toast(e.message) } },'') },
  'member-unblock':async el=>{ if(!isBoss()) return; const id=el.dataset.id;
    try{ const j=await api('block',{id,blocked:false}); S.members[id]=j.data; render(); toast('Доступ возвращён. Сотрудник входит со своим паролем') }catch(e){ toast(e.message) } },
  'member-pass':async()=>{ const id=S.overlay.id, inp=$('#m-newpass'), p=inp.value; if(p.length<6){ toast('Пароль должен быть не короче 6 символов'); inp.focus(); return }
    try{ await api('password',{id,password:p}); inp.value=''; toast('Пароль изменён. Передайте его сотруднику') }catch(e){ toast(e.message) } },
  'gen-pass':el=>{ const i=$('#'+(el.dataset.t||'m-pass')); if(i){ i.value=genPass(); i.focus(); i.select() } },
  logout:()=>logout(),
  'deals-mode':el=>{ S.dealsMode=el.dataset.v; render(true) },
  'deals-status':el=>{ S.dealsStatus=el.dataset.v; render(true) },
  'task-filter':el=>{ S.taskFilter=el.dataset.v; render(true) },
  'contact-tab':el=>{ S.contactTab=el.dataset.v; render(true) },
  period:el=>{ S.period=el.dataset.v; render(true) },
  'stage-add':()=>{ const st=stages().slice(); st.push({id:'s_'+newId(),name:'Новый этап',color:PALETTE[st.length%PALETTE.length]}); putStages(st) },
  'stage-color':el=>putStages(stages().map(s=>s.id===el.dataset.id?Object.assign({},s,{color:el.dataset.v}):s)),
  'stage-up':el=>moveStage(el.dataset.id,-1),
  'stage-down':el=>moveStage(el.dataset.id,1),
  'stage-del':el=>{ const id=el.dataset.id; const n=vis('deals').filter(d=>d.stage===id).length;
    if(n){ toast('Сначала перенесите '+n+' '+plural(n,'сделку','сделки','сделок')+' из этого этапа'); return }
    if(stages().length<=1){ toast('В воронке должен остаться хотя бы один этап'); return }
    confirmBox('Удалить этап «'+stageOf(id).name+'»?','Удалить',()=>putStages(stages().filter(s=>s.id!==id))) },
  'confirm-no':()=>{ $('#confirmLayer').innerHTML='' },
  'confirm-yes':()=>{ const cb=confirmBox.cb; $('#confirmLayer').innerHTML=''; cb&&cb() }
};
function moveStage(id,dir){ const st=stages().slice(); const i=st.findIndex(s=>s.id===id), j=i+dir; if(i<0||j<0||j>=st.length) return; [st[i],st[j]]=[st[j],st[i]]; putStages(st) }

document.addEventListener('click',e=>{ const el=e.target.closest('[data-a]'); if(!el) return; const a=el.dataset.a;
  if(el.tagName==='SELECT'||el.tagName==='INPUT') return; if(A[a]) A[a](el,e) });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if($('#confirmLayer').innerHTML) $('#confirmLayer').innerHTML=''; else if(S.overlay) backOrClose() }
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('card')) A['open-deal'](e.target,e) });
document.addEventListener('change',e=>{ const el=e.target; const a=el.dataset&&el.dataset.a;
  if(a==='deals-owner'){ S.dealsOwner=el.value; el.blur(); render(true) }
  else if(a==='sel-new'){ $('#'+el.dataset.t).hidden=el.value!=='__new' }
  else if(a==='stage-sel'){ renderStageBar(el.value) }
  else if(a==='pipe-sel'){ const o=S.overlay; o.pipe=el.value; const d=o.isNew?null:S.deals[o.id]; const cur=d&&dealPipe(d)===el.value?d.stage:stagesOf(el.value)[0].id;
    const s=$('#d-stage'); s.innerHTML=stageOptions(el.value,cur); s.value=cur; renderStageBar(cur) }
  else if(a==='pipe-name'){ const v=el.value.trim(); const p=pipeOf(S.pipe); if(!v){ el.value=p.name; return } savePipe(p,{name:v.slice(0,60)}) }
  else if(a==='perm'){ const e2=el.dataset.e, k=el.dataset.k, v=el.value; el.className='inp lv-'+v; saveRole(S.roleSel,r=>{ r.perms=r.perms||{}; r.perms[e2]=r.perms[e2]||{}; r.perms[e2][k]=v }) }
  else if(a==='role-name'){ const v=el.value.trim(); if(!v){ el.value=(roles().find(x=>x.id===S.roleSel)||{}).name||''; return } saveRole(S.roleSel,r=>{ r.name=v.slice(0,40) }) }
  else if(a==='role-pipe'){ const boxes=[...document.querySelectorAll('[data-a="role-pipe"]')]; const on=boxes.filter(b=>b.checked).map(b=>b.dataset.v);
    saveRole(S.roleSel,r=>{ r.pipes=on.length===boxes.length?'all':on }) }
  else if(a==='role-flag'){ const k=el.dataset.k, v=el.checked; saveRole(S.roleSel,r=>{ r[k]=v }) }
  else if(a==='stage-name'){ const v=el.value.trim(); if(!v){ el.value=stageOf(el.dataset.id).name; return } putStages(stages().map(s=>s.id===el.dataset.id?Object.assign({},s,{name:v.slice(0,60)}):s)) } });
document.addEventListener('submit',e=>{ if(e.target.id==='dealForm'){ e.preventDefault(); saveDeal() } });
document.addEventListener('input',e=>{ if(e.target.id==='waText') updateWa() });
let qT; $('#q').addEventListener('input',e=>{ clearTimeout(qT); qT=setTimeout(()=>{ S.q=e.target.value; render(true) },150) });

// перетаскивание карточек
let dragId=null;
document.addEventListener('dragstart',e=>{ const c=e.target.closest&&e.target.closest('.card'); if(!c) return; dragId=c.dataset.id; c.classList.add('drag'); try{ e.dataTransfer.setData('text/plain',dragId); e.dataTransfer.effectAllowed='move' }catch(_){} });
document.addEventListener('dragend',e=>{ document.querySelectorAll('.drag,.over').forEach(x=>x.classList.remove('drag','over')); dragId=null });
document.addEventListener('dragover',e=>{ const z=e.target.closest&&e.target.closest('[data-drop]'); if(!z||!dragId) return; e.preventDefault(); document.querySelectorAll('.over').forEach(x=>{ if(x!==z) x.classList.remove('over') }); z.classList.add('over') });
document.addEventListener('drop',e=>{ const z=e.target.closest&&e.target.closest('[data-drop]'); if(!z||!dragId) return; e.preventDefault(); const id=dragId, to=z.dataset.drop; z.classList.remove('over');
  if(to==='__delete'&&!can('deals','del',S.deals[id])) toast('Нет прав на удаление этой сделки');
  else if(to==='__delete') confirmBox('Удалить сделку «'+(S.deals[id]||{}).title+'»?','Удалить',async()=>{ if(await del('deals',id)) toast('Сделка удалена') });
  else moveDeal(id,to) });

boot();
})();
</script>

</body>
</html>
